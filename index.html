<!-- Font dễ đọc – sang -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">

<style>
/* ===== BODY ===== */
body {
    margin: 0;
    padding: 0;
    font-family: 'Roboto', sans-serif;
    background-color: #b30000;
    background-image:
        radial-gradient(circle at 10% 10%, rgba(255,215,0,0.12) 2px, transparent 2px),
        radial-gradient(circle at 90% 90%, rgba(255,215,0,0.12) 2px, transparent 2px);
    background-size: 60px 60px;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #ffd700;
}

/* ===== KHUNG BAO LÌ XÌ ===== */
.envelope {
    width: 94%;
    max-width: 420px;
    background: linear-gradient(180deg, #cc0000, #990000);
    border-radius: 18px;
    padding: 22px 18px 28px;
    position: relative;
    box-shadow: 0 10px 25px rgba(0,0,0,0.35);
}

/* Viền vàng bao lì xì */
.envelope::before {
    content: "";
    position: absolute;
    inset: 6px;
    border-radius: 14px;
    border: 2px solid #ffd700;
    pointer-events: none;
}

/* Hoa văn góc (kiểu đồng xu) */
.corner {
    position: absolute;
    width: 28px;
    height: 28px;
    border: 2px solid #ffd700;
    border-radius: 50%;
}
.corner::after {
    content: "";
    position: absolute;
    inset: 7px;
    border: 2px solid #ffd700;
    border-radius: 50%;
}

.top-left { top: 10px; left: 10px; }
.top-right { top: 10px; right: 10px; }
.bottom-left { bottom: 10px; left: 10px; }
.bottom-right { bottom: 10px; right: 10px; }

/* ===== NỘI DUNG ===== */
h1 {
    font-family: 'Playfair Display', serif;
    font-size: 28px;
    margin: 6px 0;
}

h2 {
    font-size: 18px;
    margin: 4px 0;
    font-weight: 500;
}

.note {
    font-size: 14px;
    margin: 12px 0;
}

/* ===== INPUT + BUTTON ===== */
.controls {
    margin-top: 12px;
}

input[type="number"] {
    width: 70px;
    padding: 8px;
    font-size: 16px;
    text-align: center;
    border-radius: 6px;
    border: 2px solid #ffd700;
    background: transparent;
    color: #ffd700;
}

button {
    margin-left: 8px;
    padding: 8px 18px;
    font-size: 16px;
    border-radius: 6px;
    border: none;
    background: #ffd700;
    color: #990000;
    font-weight: 600;
    cursor: pointer;
}

button:active {
    transform: scale(0.96);
}

/* ===== KẾT QUẢ ===== */
#result {
    margin-top: 18px;
    padding: 14px;
    font-size: 16px;
    line-height: 1.5;
    display: none;
    border-top: 1px dashed rgba(255,215,0,0.6);
}

/* ===== FOOTER ===== */
footer {
    margin-top: 18px;
    font-size: 11px;
    opacity: 0.9;
}

/* ===== MOBILE ===== */
@media (max-width: 480px) {
    h1 { font-size: 24px; }
    h2 { font-size: 16px; }
    #result { font-size: 15px; }
}

    const num = parseInt(document.getElementById("numberInput").value);
    const resultDiv = document.getElementById("result");

        const que = queData[num][Math.floor(Math.random() * queData[num].length)];
        resultDiv.textContent = que;
        resultDiv.style.display = "block";
    } else {
        resultDiv.textContent = "Vui lòng nhập số từ 1 đến 50.";
        resultDiv.style.display = "block";
